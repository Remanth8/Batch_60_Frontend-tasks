<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Adding the two numbers</h1>
    <label for="">Enter the number1:</label>
    <input type="text" placeholder="Number" id="n1"><br>
    <label for="">Enter the number2:</label>
    <input type="text" placeholder="Number" id="n2"><br>
    <label for="">Enter the Result:</label>
    <input type="text" placeholder="Result" id="res"><br>
    <button onclick="addTwo()">Add</button>

    <h1>Average of the three numbers</h1>
    <label for="">Enter the number1:</label>
    <input type="text" placeholder="Number" id="a"><br>
    <label for="">Enter the number2:</label>
    <input type="text" placeholder="Number" id="b"><br>
    <label for="">Enter the number3:</label>
    <input type="text" placeholder="Number" id="c"><br>
    <label for="">Enter the Result:</label>
    <input type="text" placeholder="Result" id="result"><br>
    <button onclick="avg()">Average</button>

    <h1>Sum of first n natural numbers</h1>
    <label for="">Enter the value:</label>
    <input type="text" placeholder="Enter the number" id="x"><br>
    <label for="">Result</label>
    <input type="text" placeholder="Result" id="output"><br>
    <button onclick="sum()">Submit</button>

    <h1>Average of first n natural numbers</h1>
    <label for="">Enter the value:</label>
    <input type="text" placeholder="Enter the number" id="y"><br>
    <label for="">Result</label>
    <input type="text" placeholder="Result" id="output1"><br>
    <button onclick="avgofn()">Submit</button>

    <h1>Missing angle in triangle</h1>
    <label for="">First angle:</label>
    <input type="text" placeholder="Enter angle" id="a1"><br>
    <label for="">Second angle:</label>
    <input type="text" placeholder="Enter angle" id="b1"><br>
    <label for="">Third angle:</label>
    <input type="text" placeholder="Third angle" id="c1"> <br>
    <button onclick="missing_angle()">Result</button>

    <h1>Profit Percentage</h1>
    <label for="">Selling Price:</label>
    <input type="text" placeholder="Enter the price" id="sp"><br>
    <label for="">Cost Price:</label>
    <input type="text" placeholder="Enter the price" id="cp"><br>
    <label for="">Profit Percentage:</label>
    <input type="text" placeholder="Result" id="p"><br>
    <button onclick="per()">Submit</button>

    <h1>Simple Interest</h1>
    <label for="">Principle Amount:</label>
    <input type="text" placeholder="Enter the value" id="pa"><br>
    <label for="">Time:</label>
    <input type="text" placeholder="Enter the value" id="t"><br>
    <label for="">Rate of Interest:</label>
    <input type="text" placeholder="Enter the value" id="r"><br>
    <label for="">Simple Interest:</label>
    <input type="text" placeholder="Enter the value" id="si"><br>
    <button onclick="simpleinterest()">Submit</button>
    <script type="text/javascript" src="script.js"></script>

</body>
</html>
