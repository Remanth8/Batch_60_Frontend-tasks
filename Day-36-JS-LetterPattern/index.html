<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let j=1;j<=7;j++){
            for(let i=1;i<=5;i++){
                if(i==1||j==1||j==4||(i==5&&j>=4)||j==7){
                    document.write("*");
                }
                else{
                    document.write("&nbsp;&nbsp;")
                }
            }
            document.write("<br/>");
        }
    </script>
</body>
</html>
